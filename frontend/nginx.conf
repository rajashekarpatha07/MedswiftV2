server {
    listen 80;
    server_name medswift.duckdns.org;

    # 1. Serve React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This handles React Router's client-side routing
        try_files $uri $uri/ /index.html; 
    }

    # 2. Proxy API Requests to Node.js Backend
    location /api/ {
        # 'backend' is the service name from your docker-compose.yml
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Proxy Socket.IO Requests
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}