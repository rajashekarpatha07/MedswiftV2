# 1. Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name medswift.duckdns.org;
    return 301 https://$host$request_uri;
}

# 2. The Secure HTTPS Server
server {
    listen 443 ssl;
    server_name medswift.duckdns.org;

    # Point to the Let's Encrypt certificates we just mounted
    ssl_certificate /etc/letsencrypt/live/medswift.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medswift.duckdns.org/privkey.pem;

    # Serve React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; 
    }

    # Proxy API Requests
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Socket.IO Requests
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}