services:
  backend:
    build: .
    container_name: medswift_backend
    # We keep 5000 open for local testing, but the tunnel will use the internal name
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # IMPORTANT: If your frontend calls the API, BASE_URL might need to be the Public URL
      - BASE_URL=http://backend:5000 
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
    networks:
      - medswift_network

  frontend:
    build: ./frontend
    container_name: medswift_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medswift_network

  # This is your "magic" bridge to the internet
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: medswift_tunnel
    command: tunnel --url http://frontend:80
    restart: always
    networks:
      - medswift_network

networks:
  medswift_network:
    driver: bridge